<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Choose a new password for your Seed2Serve account." />
  <title>Reset Password | Seed2Serve</title>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap"
    rel="stylesheet"
  />

  <link rel="stylesheet" href="css/design-system.css" />
  <link rel="stylesheet" href="css/auth.css" />
</head>
<body class="auth-body">
  <main class="auth-shell auth-shell--narrow">
    <a href="index.html#home" class="auth__home-link">
      <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M19 12H5M12 19l-7-7 7-7" />
      </svg>
      Back to site
    </a>

    <div class="auth-card auth-card--solo">
      <div class="auth-face auth-face--solo">
        <div class="auth-panel auth-panel--form">
          <div class="auth-form-wrap">
            <a href="index.html#home" class="auth-brand" aria-label="Seed2Serve home">
              <img class="auth-brand__logo" src="assets/logo.png" alt="Seed2Serve logo" />
              <span class="auth-brand-name">Seed2Serve</span>
            </a>
            <h1 class="auth-title">Set a New Password</h1>
            <p class="auth-subtitle">
              Choose a strong password you don't use anywhere else.
            </p>

            <form class="auth-form" id="resetForm" novalidate>
              <div class="auth-field">
                <label class="auth-label" for="resetPassword">New password</label>
                <div class="auth-input-wrap">
                  <input
                    class="auth-input auth-input--password"
                    type="password"
                    id="resetPassword"
                    name="password"
                    autocomplete="new-password"
                    placeholder="At least 8 characters"
                  />
                  <button
                    type="button"
                    class="auth-eye"
                    data-eye-for="resetPassword"
                    aria-label="Show password"
                    aria-pressed="false"
                    tabindex="-1"
                  >
                    <svg class="auth-eye__open" viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                      <path d="M2 12s3.5-6.5 10-6.5S22 12 22 12s-3.5 6.5-10 6.5S2 12 2 12Z" />
                      <circle cx="12" cy="12" r="3" />
                    </svg>
                    <svg class="auth-eye__closed" viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                      <path d="M3 3l18 18" />
                      <path d="M10.5 5.2A10.9 10.9 0 0 1 12 5c6.5 0 10 7 10 7a18.6 18.6 0 0 1-3.1 3.8M6.5 6.5A17.9 17.9 0 0 0 2 12s3.5 7 10 7a10 10 0 0 0 3.5-.6M9.9 9.9a3 3 0 0 0 4.2 4.2" />
                    </svg>
                  </button>
                </div>
                <span class="auth-error" data-error-for="resetPassword"></span>
              </div>

              <div class="auth-field">
                <label class="auth-label" for="resetConfirm">Confirm new password</label>
                <div class="auth-input-wrap">
                  <input
                    class="auth-input auth-input--password"
                    type="password"
                    id="resetConfirm"
                    name="confirm"
                    autocomplete="new-password"
                    placeholder="Re-enter your new password"
                  />
                  <button
                    type="button"
                    class="auth-eye"
                    data-eye-for="resetConfirm"
                    aria-label="Show password"
                    aria-pressed="false"
                    tabindex="-1"
                  >
                    <svg class="auth-eye__open" viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                      <path d="M2 12s3.5-6.5 10-6.5S22 12 22 12s-3.5 6.5-10 6.5S2 12 2 12Z" />
                      <circle cx="12" cy="12" r="3" />
                    </svg>
                    <svg class="auth-eye__closed" viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                      <path d="M3 3l18 18" />
                      <path d="M10.5 5.2A10.9 10.9 0 0 1 12 5c6.5 0 10 7 10 7a18.6 18.6 0 0 1-3.1 3.8M6.5 6.5A17.9 17.9 0 0 0 2 12s3.5 7 10 7a10 10 0 0 0 3.5-.6M9.9 9.9a3 3 0 0 0 4.2 4.2" />
                    </svg>
                  </button>
                </div>
                <span class="auth-error" data-error-for="resetConfirm"></span>
              </div>

              <button type="submit" class="btn btn--primary btn--block auth-submit" id="resetSubmit">Update Password</button>

              <p class="auth-alert auth-alert--global" id="resetAlert" role="alert"></p>
            </form>

            <div class="auth-switch">
              <p class="auth-switch__text">Changed your mind?</p>
              <a href="login.html" class="btn btn--outline btn--block auth-switch__btn">Back to Log In</a>
            </div>
          </div>
        </div>
      </div>
    </div>

    <p class="auth-footnote">&copy; <span id="year"></span> Seed2Serve. All rights reserved.</p>
  </main>

  <script src="js/reset-password.js" defer></script>
</body>
</html>
