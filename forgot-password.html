<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Forgot your Seed2Serve password? Request a reset link." />
  <title>Forgot Password | Seed2Serve</title>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap"
    rel="stylesheet"
  />

  <link rel="stylesheet" href="css/design-system.css" />
  <link rel="stylesheet" href="css/auth.css" />
</head>
<body class="auth-body">
  <main class="auth-shell auth-shell--narrow">
    <a href="index.html#home" class="auth__home-link">
      <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M19 12H5M12 19l-7-7 7-7" />
      </svg>
      Back to site
    </a>

    <div class="auth-card auth-card--solo">
      <div class="auth-face auth-face--solo">
        <div class="auth-panel auth-panel--form">
          <div class="auth-form-wrap">
            <a href="index.html#home" class="auth-brand" aria-label="Seed2Serve home">
              <img class="auth-brand__logo" src="assets/logo.png" alt="Seed2Serve logo" />
              <span class="auth-brand-name">Seed2Serve</span>
            </a>
            <h1 class="auth-title">Forgot Password</h1>
            <p class="auth-subtitle">
              Enter the email you signed up with and we'll send you a
              link to reset your password.
            </p>

            <form class="auth-form" id="forgotForm" novalidate>
              <div class="auth-field">
                <label class="auth-label" for="forgotIdentity">Email</label>
                <input
                  class="auth-input"
                  type="email"
                  id="forgotIdentity"
                  name="identity"
                  autocomplete="email"
                  placeholder="Enter your email"
                />
                <span class="auth-error" data-error-for="forgotIdentity"></span>
              </div>

              <button type="submit" class="btn btn--primary btn--block auth-submit" id="forgotSubmit">Send Reset Link</button>

              <p class="auth-alert auth-alert--global" id="forgotAlert" role="alert"></p>
            </form>

            <div class="auth-switch">
              <p class="auth-switch__text">Remembered it now?</p>
              <a href="login.html" class="btn btn--outline btn--block auth-switch__btn">Back to Log In</a>
            </div>
          </div>
        </div>
      </div>
    </div>

    <p class="auth-footnote">&copy; <span id="year"></span> Seed2Serve. All rights reserved.</p>
  </main>

  <script src="js/forgot.js" defer></script>
</body>
</html>
